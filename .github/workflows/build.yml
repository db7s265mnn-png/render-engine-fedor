name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Linux jobs intentionally disabled for now — re-enable when requested.
  linux:
    name: Linux (Embree, tests)
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "Linux builds are disabled"

  linux-optix:
    name: Linux (OptiX backend compile)
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "Linux OptiX builds are disabled"

  windows:
    name: Windows (Clang, standalone exe)
    runs-on: windows-2022
    env:
      EMBREE_VERSION: "4.4.0"
      IMATH_VERSION: "v3.1.12"
      ALEMBIC_VERSION: "1.8.6"
      OPENEXR_VERSION: "v3.2.4"
      DEPS_PREFIX: "C:/solstice-deps"
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          arch: win64_msvc2019_64
          cache: true

      # clang-cl needs the MSVC headers / link.exe / Windows SDK on PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate Clang
        shell: pwsh
        run: |
          $clangCl = Get-Command clang-cl -ErrorAction SilentlyContinue
          if (-not $clangCl) {
            # Prefer the VS-bundled LLVM, then the standalone LLVM install.
            $candidates = @(
              "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\clang-cl.exe",
              "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin\clang-cl.exe",
              "${env:ProgramFiles}\LLVM\bin\clang-cl.exe"
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) {
                $dir = Split-Path $c -Parent
                $env:PATH = "$dir;$env:PATH"
                echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                break
              }
            }
            $clangCl = Get-Command clang-cl -ErrorAction SilentlyContinue
          }
          if (-not $clangCl) { throw "clang-cl not found on the runner" }
          Write-Host "clang-cl: $($clangCl.Source)"
          & clang-cl --version

      # OptiX/CUDA disabled on Windows CI: nvcc hangs the Build step for 30–80+ min.
      # GPU OptiX is still available when building locally with -DSOLSTICE_ENABLE_OPTIX=ON.

      - name: Cache the third party dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: winvdeps-embree${{ env.EMBREE_VERSION }}-imath${{ env.IMATH_VERSION }}-alembic${{ env.ALEMBIC_VERSION }}-openexr${{ env.OPENEXR_VERSION }}-mtlx1.39.4

      - name: Fetch Embree
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          $url = "https://github.com/RenderKit/embree/releases/download/v$env:EMBREE_VERSION/embree-$env:EMBREE_VERSION.x64.windows.zip"
          Invoke-WebRequest -Uri $url -OutFile embree.zip
          Expand-Archive embree.zip -DestinationPath "$env:DEPS_PREFIX/embree"

      - name: Build Imath
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $env:IMATH_VERSION https://github.com/AcademySoftwareFoundation/Imath.git imath-src
          cmake -S imath-src -B imath-src/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX" -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF
          cmake --build imath-src/build --config Release --target install

      - name: Build OpenEXR
        if: steps.deps-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git clone --depth 1 --branch $env:OPENEXR_VERSION https://github.com/AcademySoftwareFoundation/openexr.git openexr-src
          cmake -S openexr-src -B openexr-src/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX" -DCMAKE_PREFIX_PATH="$env:DEPS_PREFIX" `
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DOPENEXR_BUILD_TOOLS=OFF `
            -DOPENEXR_INSTALL_EXAMPLES=OFF -DOPENEXR_FORCE_INTERNAL_DEFLATE=ON
          cmake --build openexr-src/build --config Release --target install

      - name: Build Alembic
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $env:ALEMBIC_VERSION https://github.com/alembic/alembic.git alembic-src
          cmake -S alembic-src -B alembic-src/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX" -DCMAKE_PREFIX_PATH="$env:DEPS_PREFIX" `
            -DUSE_HDF5=OFF -DALEMBIC_SHARED_LIBS=OFF -DUSE_TESTS=OFF -DUSE_BINARIES=OFF `
            -DUSE_EXAMPLES=OFF -DALEMBIC_BUILD_LIBS=ON
          cmake --build alembic-src/build --config Release --target install

      - name: Build MaterialX
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.39.4 https://github.com/AcademySoftwareFoundation/MaterialX.git materialx-src
          cmake -S materialx-src -B materialx-src/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX" `
            -DMATERIALX_BUILD_PYTHON=OFF -DMATERIALX_BUILD_VIEWER=OFF `
            -DMATERIALX_BUILD_GRAPH_EDITOR=OFF -DMATERIALX_BUILD_TESTS=OFF `
            -DMATERIALX_BUILD_JS=OFF -DMATERIALX_BUILD_RENDER=OFF `
            -DMATERIALX_BUILD_GEN_GLSL=OFF -DMATERIALX_BUILD_GEN_OSL=OFF `
            -DMATERIALX_BUILD_GEN_MDL=OFF -DMATERIALX_BUILD_GEN_MSL=OFF `
            -DMATERIALX_INSTALL_PYTHON=OFF -DMATERIALX_INSTALL_RESOURCES=OFF
          cmake --build materialx-src/build --config Release --target install
          New-Item -ItemType Directory -Force -Path "$env:DEPS_PREFIX/libraries" | Out-Null
          Copy-Item -Recurse materialx-src/libraries/* "$env:DEPS_PREFIX/libraries/"

      - name: Configure (Clang + Ninja)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="$env:DEPS_PREFIX;$env:DEPS_PREFIX/embree" `
            -DSOLSTICE_MATERIALX_LIBRARIES="$env:DEPS_PREFIX/libraries" `
            -DSOLSTICE_ENABLE_OPTIX=OFF `
            -DSOLSTICE_MODERN_CPU=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run the tests
        run: |
          $env:PATH = "$env:DEPS_PREFIX/embree/bin;$env:PATH"
          ./build/bin/solstice_tests.exe

      - name: Assemble the distribution
        run: |
          cmake --build build --target deploy
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/bin/* dist/ -Recurse -Force
          Copy-Item "$env:DEPS_PREFIX/embree/bin/*.dll" dist/ -Force
          # oneTBB / OpenPGL runtime (FetchContent build trees)
          Get-ChildItem -Path build -Recurse -Filter "tbb*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName dist/ -Force }
          Get-ChildItem -Path build -Recurse -Filter "tbbmalloc*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName dist/ -Force }
          if (Test-Path "$env:DEPS_PREFIX/libraries") {
            New-Item -ItemType Directory -Force -Path dist/materialx | Out-Null
            Copy-Item -Recurse "$env:DEPS_PREFIX/libraries" dist/materialx/libraries
          }
          Copy-Item README.md dist/
          Copy-Item -Recurse docs dist/docs
          Copy-Item -Recurse examples dist/examples
          Remove-Item dist/solstice_tests.exe -ErrorAction SilentlyContinue
          Get-ChildItem dist

      - name: Render a frame with the packaged exe
        run: |
          Start-Process -FilePath "dist/Bob_Render.exe" `
            -ArgumentList '--headless','-o','windows-smoke.png','-s','16','--width','480','--height','270' `
            -Wait -NoNewWindow
          if (-not (Test-Path windows-smoke.png)) { throw "the packaged exe did not produce an image" }
          Get-Item windows-smoke.png

      - uses: actions/upload-artifact@v4
        with:
          name: Bob-Render-windows-x64
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-render
          path: windows-smoke.png
