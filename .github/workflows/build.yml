name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Linux jobs intentionally disabled for now — re-enable when requested.
  linux:
    name: Linux (Embree, tests)
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "Linux builds are disabled"

  linux-optix:
    name: Linux (OptiX backend compile)
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "Linux OptiX builds are disabled"

  windows:
    name: Windows (Clang, OptiX exe)
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      EMBREE_VERSION: "4.4.0"
      IMATH_VERSION: "v3.1.12"
      ALEMBIC_VERSION: "1.8.6"
      OPENEXR_VERSION: "v3.2.4"
      OCIO_VERSION: "v2.3.2"
      OIIO_VERSION: "v3.0.21.0"
      OPENVDB_VERSION: "v12.0.1"
      DEPS_PREFIX: "C:/solstice-deps"
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          arch: win64_msvc2019_64
          cache: true

      # clang-cl needs the MSVC headers / link.exe / Windows SDK on PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate Clang
        shell: pwsh
        run: |
          $clangCl = Get-Command clang-cl -ErrorAction SilentlyContinue
          if (-not $clangCl) {
            # Prefer the VS-bundled LLVM, then the standalone LLVM install.
            $candidates = @(
              "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\clang-cl.exe",
              "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin\clang-cl.exe",
              "${env:ProgramFiles}\LLVM\bin\clang-cl.exe"
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) {
                $dir = Split-Path $c -Parent
                $env:PATH = "$dir;$env:PATH"
                echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                break
              }
            }
            $clangCl = Get-Command clang-cl -ErrorAction SilentlyContinue
          }
          if (-not $clangCl) { throw "clang-cl not found on the runner" }
          Write-Host "clang-cl: $($clangCl.Source)"
          & clang-cl --version

      # Windows OptiX: nvcc + OptiX headers. Linux OptiX stays off (jobs above are if: false).
      # Do NOT install visual_studio_integration / Nsight — those hang the CUDA installer
      # on windows-2022. nvcc must use MSVC cl.exe, not clang-cl (that hung CI 30–80+ min).
      - name: Install CUDA toolkit
        timeout-minutes: 40
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.6.3"
          method: network
          sub-packages: '["nvcc","cudart","thrust"]'
          use-github-cache: true

      - name: Put nvcc on PATH
        shell: pwsh
        run: |
          if (-not $env:CUDA_PATH) { throw "CUDA_PATH was not set by cuda-toolkit" }
          $bin = Join-Path $env:CUDA_PATH "bin"
          $nvcc = Join-Path $bin "nvcc.exe"
          if (-not (Test-Path $nvcc)) { throw "nvcc.exe missing at $nvcc" }
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          & $nvcc --version

      - name: Fetch the OptiX headers
        shell: pwsh
        run: |
          $dst = Join-Path $env:RUNNER_TEMP "optix-dev"
          if (-not (Test-Path "$dst/include/optix.h")) {
            git clone --depth 1 --branch v7.7.0 https://github.com/NVIDIA/optix-dev.git $dst
          }
          if (-not (Test-Path "$dst/include/optix.h")) { throw "optix.h missing after clone" }
          Write-Host "OptiX headers: $dst/include"

      - name: Cache the third party dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: winvdeps-embree${{ env.EMBREE_VERSION }}-imath${{ env.IMATH_VERSION }}-alembic${{ env.ALEMBIC_VERSION }}-openexr${{ env.OPENEXR_VERSION }}-ocio${{ env.OCIO_VERSION }}-oiio${{ env.OIIO_VERSION }}-onetbb2021.12-openvdb${{ env.OPENVDB_VERSION }}-mtlx1.39.4

      - name: Fetch Embree
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          $url = "https://github.com/RenderKit/embree/releases/download/v$env:EMBREE_VERSION/embree-$env:EMBREE_VERSION.x64.windows.zip"
          Invoke-WebRequest -Uri $url -OutFile embree.zip
          Expand-Archive embree.zip -DestinationPath "$env:DEPS_PREFIX/embree"

      - name: Build Imath
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $env:IMATH_VERSION https://github.com/AcademySoftwareFoundation/Imath.git imath-src
          cmake -S imath-src -B imath-src/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX" -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF
          cmake --build imath-src/build --config Release --target install

      - name: Build OpenEXR
        if: steps.deps-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git clone --depth 1 --branch $env:OPENEXR_VERSION https://github.com/AcademySoftwareFoundation/openexr.git openexr-src
          cmake -S openexr-src -B openexr-src/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX" -DCMAKE_PREFIX_PATH="$env:DEPS_PREFIX" `
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DOPENEXR_BUILD_TOOLS=OFF `
            -DOPENEXR_INSTALL_EXAMPLES=OFF -DOPENEXR_FORCE_INTERNAL_DEFLATE=ON
          cmake --build openexr-src/build --config Release --target install

      - name: Build Alembic
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $env:ALEMBIC_VERSION https://github.com/alembic/alembic.git alembic-src
          cmake -S alembic-src -B alembic-src/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX" -DCMAKE_PREFIX_PATH="$env:DEPS_PREFIX" `
            -DUSE_HDF5=OFF -DALEMBIC_SHARED_LIBS=OFF -DUSE_TESTS=OFF -DUSE_BINARIES=OFF `
            -DUSE_EXAMPLES=OFF -DALEMBIC_BUILD_LIBS=ON
          cmake --build alembic-src/build --config Release --target install

      - name: Build MaterialX
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.39.4 https://github.com/AcademySoftwareFoundation/MaterialX.git materialx-src
          cmake -S materialx-src -B materialx-src/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX" `
            -DMATERIALX_BUILD_PYTHON=OFF -DMATERIALX_BUILD_VIEWER=OFF `
            -DMATERIALX_BUILD_GRAPH_EDITOR=OFF -DMATERIALX_BUILD_TESTS=OFF `
            -DMATERIALX_BUILD_JS=OFF -DMATERIALX_BUILD_RENDER=OFF `
            -DMATERIALX_BUILD_GEN_GLSL=OFF -DMATERIALX_BUILD_GEN_OSL=OFF `
            -DMATERIALX_BUILD_GEN_MDL=OFF -DMATERIALX_BUILD_GEN_MSL=OFF `
            -DMATERIALX_INSTALL_PYTHON=OFF -DMATERIALX_INSTALL_RESOURCES=OFF
          cmake --build materialx-src/build --config Release --target install
          New-Item -ItemType Directory -Force -Path "$env:DEPS_PREFIX/libraries" | Out-Null
          Copy-Item -Recurse materialx-src/libraries/* "$env:DEPS_PREFIX/libraries/"

      # OpenColorIO shared DLL for Nuke-style Display/View. Config/LUTs stay on the
      # user's machine (OCIO env or Film → OCIO Config) — not shipped in the zip.
      - name: Build OpenColorIO
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $env:OCIO_VERSION https://github.com/AcademySoftwareFoundation/OpenColorIO.git ocio-src
          cmake -S ocio-src -B ocio-src/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX" `
            -DCMAKE_PREFIX_PATH="$env:DEPS_PREFIX" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DOCIO_BUILD_APPS=OFF `
            -DOCIO_BUILD_TESTS=OFF `
            -DOCIO_BUILD_GPU_TESTS=OFF `
            -DOCIO_BUILD_PYTHON=OFF `
            -DOCIO_BUILD_JAVA=OFF `
            -DOCIO_BUILD_DOCS=OFF `
            -DOCIO_INSTALL_EXT_PACKAGES=ALL
          cmake --build ocio-src/build --config Release --target install

      # OpenImageIO tools (maketx + oiiotool) for TX Converter / auto-TX. Ships next to the exe.
      # OIIO 3.x: no Boost; OpenImageIO_BUILD_MISSING_DEPS fetches jpeg/tiff/zlib/etc.
      - name: Build OpenImageIO
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $env:OIIO_VERSION https://github.com/AcademySoftwareFoundation/OpenImageIO.git oiio-src
          cmake -S oiio-src -B oiio-src/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX" `
            -DCMAKE_PREFIX_PATH="$env:DEPS_PREFIX" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DUSE_PYTHON=OFF `
            -DOIIO_BUILD_TESTS=OFF `
            -DOIIO_BUILD_TOOLS=ON `
            -DUSE_OPENCOLORIO=ON `
            -DOpenImageIO_BUILD_MISSING_DEPS=all `
            -DSTOP_ON_WARNING=OFF
          if ($LASTEXITCODE -ne 0) { throw "OpenImageIO cmake configure failed" }
          cmake --build oiio-src/build --config Release --target install --parallel
          if ($LASTEXITCODE -ne 0) { throw "OpenImageIO build/install failed" }
          if (-not (Test-Path "$env:DEPS_PREFIX/bin/maketx.exe")) {
            throw "maketx.exe was not installed by OpenImageIO"
          }
          if (-not (Test-Path "$env:DEPS_PREFIX/bin/oiiotool.exe")) {
            throw "oiiotool.exe was not installed by OpenImageIO (needed for PNG/JPG and TX reformat)"
          }
          Write-Host "Installed maketx: $env:DEPS_PREFIX/bin/maketx.exe"
          Write-Host "Installed oiiotool: $env:DEPS_PREFIX/bin/oiiotool.exe"
          Get-ChildItem "$env:DEPS_PREFIX/bin" -Filter "OpenImageIO*" | ForEach-Object { Write-Host $_.Name }

      # oneTBB headers+libs for OpenVDB (Embree ships only tbb*.dll/.lib, no headers).
      - name: Build oneTBB
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v2021.12.0 https://github.com/oneapi-src/oneTBB.git onetbb-src
          cmake -S onetbb-src -B onetbb-src/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX" `
            -DCMAKE_BUILD_TYPE=Release `
            -DTBB_TEST=OFF `
            -DTBB_STRICT=OFF `
            -DBUILD_SHARED_LIBS=ON
          if ($LASTEXITCODE -ne 0) { throw "oneTBB cmake configure failed" }
          cmake --build onetbb-src/build --config Release --target install --parallel
          if ($LASTEXITCODE -ne 0) { throw "oneTBB build/install failed" }
          if (-not (Test-Path "$env:DEPS_PREFIX/include/tbb/tbb.h") -and
              -not (Test-Path "$env:DEPS_PREFIX/include/oneapi/tbb.h")) {
            throw "oneTBB headers missing after install"
          }
          Write-Host "Installed oneTBB under $env:DEPS_PREFIX"

      # OpenVDB core (SDF / fog volumes). oneTBB is installed above; Blosc/zlib off
      # keeps the dep graph small. Delayed loading off removes the Boost requirement.
      - name: Build OpenVDB
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $env:OPENVDB_VERSION https://github.com/AcademySoftwareFoundation/openvdb.git openvdb-src
          cmake -S openvdb-src -B openvdb-src/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$env:DEPS_PREFIX" `
            -DCMAKE_PREFIX_PATH="$env:DEPS_PREFIX" `
            -DTBB_ROOT="$env:DEPS_PREFIX" `
            -DCMAKE_BUILD_TYPE=Release `
            -DOPENVDB_BUILD_CORE=ON `
            -DOPENVDB_BUILD_BINARIES=OFF `
            -DOPENVDB_BUILD_VDB_PRINT=OFF `
            -DOPENVDB_BUILD_VDB_LOD=OFF `
            -DOPENVDB_BUILD_VDB_RENDER=OFF `
            -DOPENVDB_BUILD_VDB_VIEW=OFF `
            -DOPENVDB_BUILD_PYTHON_MODULE=OFF `
            -DOPENVDB_BUILD_UNITTESTS=OFF `
            -DOPENVDB_BUILD_NANOVDB=OFF `
            -DOPENVDB_CORE_SHARED=ON `
            -DOPENVDB_CORE_STATIC=OFF `
            -DUSE_BLOSC=OFF `
            -DUSE_ZLIB=OFF `
            -DUSE_EXR=OFF `
            -DUSE_IMATH_HALF=OFF `
            -DOPENVDB_USE_DELAYED_LOADING=OFF `
            -DDISABLE_CMAKE_SEARCH_PATHS=OFF
          if ($LASTEXITCODE -ne 0) { throw "OpenVDB cmake configure failed" }
          cmake --build openvdb-src/build --config Release --target install --parallel
          if ($LASTEXITCODE -ne 0) { throw "OpenVDB build/install failed" }
          $vdbLib = Get-ChildItem -Path "$env:DEPS_PREFIX" -Recurse -Filter "openvdb*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $vdbLib) { throw "openvdb.lib missing after install" }
          Write-Host "Installed OpenVDB: $($vdbLib.FullName)"
          Get-ChildItem "$env:DEPS_PREFIX/bin" -Filter "openvdb*" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.Name }

      - name: Configure (Clang + Ninja, OptiX ON)
        shell: pwsh
        run: |
          $cl = (Get-Command cl.exe -ErrorAction Stop).Source
          $nvcc = Join-Path $env:CUDA_PATH "bin/nvcc.exe"
          if (-not (Test-Path $nvcc)) { throw "nvcc.exe missing at $nvcc" }
          $optixRoot = Join-Path $env:RUNNER_TEMP "optix-dev"
          Write-Host "cl.exe (nvcc host): $cl"
          Write-Host "nvcc: $nvcc"
          Write-Host "OptiX_ROOT: $optixRoot"
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_CUDA_COMPILER="$nvcc" `
            -DCMAKE_CUDA_HOST_COMPILER="$cl" `
            -DCMAKE_PREFIX_PATH="$env:DEPS_PREFIX;$env:DEPS_PREFIX/embree" `
            -DSOLSTICE_MATERIALX_LIBRARIES="$env:DEPS_PREFIX/libraries" `
            -DSOLSTICE_ENABLE_OPTIX=ON `
            -DOptiX_ROOT="$optixRoot" `
            -DSOLSTICE_CUDA_HOST_COMPILER="$cl" `
            -DSOLSTICE_ENABLE_OCIO=ON `
            -DSOLSTICE_ENABLE_OPENVDB=ON `
            -DSOLSTICE_MODERN_CPU=ON `
            -DSOLSTICE_BUILD_TX_TOOLS_ALPHA=ON `
            -DSOLSTICE_BUILD_TX_TOOLS_OMEGA=ON
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          $cfg = Get-Content build/CMakeCache.txt | Select-String "SOLSTICE_HAVE_OPENVDB|SOLSTICE_HAVE_OPTIX"
          Write-Host $cfg
          if (-not (Select-String -Path build/generated/solstice_config.h -Pattern "SOLSTICE_HAVE_OPENVDB 1" -Quiet)) {
            throw "OpenVDB was not detected — VDB from Polygons would be a no-op"
          }
          if (-not (Select-String -Path build/generated/solstice_config.h -Pattern "SOLSTICE_HAVE_OPTIX 1" -Quiet)) {
            throw "OptiX was requested but not enabled — this Windows build would ship Embree-only"
          }

      - name: Compile OptiX PTX
        timeout-minutes: 45
        run: cmake --build build --target solstice_optix_programs --verbose

      - name: Prove OptiX IR is embedded
        shell: pwsh
        run: |
          $modules = @(
            @{ Ptx = 'optix_hit_miss.ptx'; Embed = 'solstice_optix_hit_miss_ir.cpp'; Sym = 'solsticeOptixHitIr' },
            @{ Ptx = 'optix_init_from_camera.ptx'; Embed = 'solstice_optix_init_from_camera_ir.cpp'; Sym = 'solsticeOptixInitIr' },
            @{ Ptx = 'optix_intersect_closest.ptx'; Embed = 'solstice_optix_intersect_closest_ir.cpp'; Sym = 'solsticeOptixIntersectClosestIr' },
            @{ Ptx = 'optix_intersect_shadow.ptx'; Embed = 'solstice_optix_intersect_shadow_ir.cpp'; Sym = 'solsticeOptixIntersectShadowIr' },
            @{ Ptx = 'optix_shade_surface.ptx'; Embed = 'solstice_optix_shade_surface_ir.cpp'; Sym = 'solsticeOptixShadeSurfaceIr' },
            @{ Ptx = 'optix_shade_background.ptx'; Embed = 'solstice_optix_shade_background_ir.cpp'; Sym = 'solsticeOptixShadeBackgroundIr' },
            @{ Ptx = 'optix_shade_shadow.ptx'; Embed = 'solstice_optix_shade_shadow_ir.cpp'; Sym = 'solsticeOptixShadeShadowIr' }
          )
          foreach ($m in $modules) {
            $ptx = Join-Path 'build/generated' $m.Ptx
            $embed = Join-Path 'build/generated' $m.Embed
            if (-not (Test-Path $ptx)) { throw "$($m.Ptx) was not produced" }
            if (-not (Test-Path $embed)) { throw "$($m.Embed) was not produced" }
            if (-not (Select-String -Path $embed -Pattern $m.Sym -Quiet)) {
              throw "embedded OptiX symbol $($m.Sym) missing"
            }
            Get-Item $ptx, $embed | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }
          }

      - name: Build
        timeout-minutes: 90
        run: cmake --build build --parallel

      - name: Run the tests
        run: |
          $env:PATH = "$env:DEPS_PREFIX/embree/bin;$env:DEPS_PREFIX/bin;$env:PATH"
          ./build/bin/solstice_tests.exe

      - name: Assemble the distribution
        run: |
          cmake --build build --target deploy
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/bin/* dist/ -Recurse -Force
          Copy-Item "$env:DEPS_PREFIX/embree/bin/*.dll" dist/ -Force
          # CUDA runtime for the OptiX backend (nvcuda.dll comes from the user's NVIDIA driver).
          if (-not $env:CUDA_PATH) { throw "CUDA_PATH missing while packaging OptiX build" }
          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          $cudart = Get-ChildItem -Path $cudaBin -Filter "cudart64_*.dll" -ErrorAction SilentlyContinue
          if (-not $cudart) { throw "cudart64_*.dll missing under $cudaBin — GPU backend would fail to load" }
          $cudart | ForEach-Object { Copy-Item $_.FullName dist/ -Force; Write-Host "Copied $($_.Name)" }
          # Ensure Qt image format plugins are present (windeployqt may omit some).
          # Note: official Qt 6.7 often builds PNG into Qt6Gui (no qpng.dll) — still copy
          # whatever is in plugins/imageformats for jpeg/gif/webp/etc.
          $qtRoot = $env:QT_ROOT_DIR
          if (-not $qtRoot -and $env:Qt6_DIR) {
            # Qt6_DIR is typically <prefix>/lib/cmake/Qt6
            $qtRoot = (Resolve-Path "$env:Qt6_DIR/../../..").Path
          }
          $imgSrc = $null
          foreach ($cand in @(
            "$qtRoot/plugins/imageformats",
            "$env:QT_ROOT_DIR/plugins/imageformats"
          )) {
            if ($cand -and (Test-Path $cand)) { $imgSrc = $cand; break }
          }
          if ($imgSrc) {
            New-Item -ItemType Directory -Force -Path dist/imageformats | Out-Null
            Get-ChildItem "$imgSrc" -Filter "q*.dll" | Where-Object { $_.Name -notmatch 'd\.dll$' } |
              ForEach-Object { Copy-Item $_.FullName dist/imageformats/ -Force; Write-Host "  $($_.Name)" }
            Write-Host "Copied Qt imageformats from $imgSrc"
          } else {
            Write-Host "WARNING: Qt imageformats folder not found"
          }
          if (-not (Test-Path "dist/qt.conf")) {
            Set-Content -Path "dist/qt.conf" -Value "[Paths]`r`nPrefix=.`r`nPlugins=.`r`n"
            Write-Host "Wrote dist/qt.conf"
          }
          # OpenColorIO runtime (config/LUTs are NOT packaged — use system OCIO / Film path)
          if (Test-Path "$env:DEPS_PREFIX/bin") {
            Get-ChildItem -Path "$env:DEPS_PREFIX/bin" -Filter "OpenColorIO*.dll" -ErrorAction SilentlyContinue |
              ForEach-Object { Copy-Item $_.FullName dist/ -Force }
            # maketx + oiiotool + OpenImageIO runtime for TX Converter / auto-TX
            foreach ($tool in @("maketx.exe", "oiiotool.exe")) {
              if (Test-Path "$env:DEPS_PREFIX/bin/$tool") {
                Copy-Item "$env:DEPS_PREFIX/bin/$tool" dist/ -Force
                Write-Host "Copied $tool"
              }
            }
            foreach ($pat in @(
              "OpenImageIO*.dll",
              "openvdb*.dll",
              "jpeg*.dll", "libjpeg*.dll", "turbojpeg*.dll",
              "tiff*.dll", "libtiff*.dll",
              "zlib*.dll", "libzlib*.dll", "zdll*.dll",
              "libpng*.dll", "png*.dll",
              "Imath*.dll", "OpenEXR*.dll", "IlmThread*.dll", "Half*.dll", "Iex*.dll"
            )) {
              Get-ChildItem -Path "$env:DEPS_PREFIX/bin" -Filter $pat -ErrorAction SilentlyContinue |
                ForEach-Object { Copy-Item $_.FullName dist/ -Force }
            }
          }
          # oneTBB / OpenPGL / FetchContent libtiff runtime
          Get-ChildItem -Path build -Recurse -Filter "tbb*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName dist/ -Force }
          Get-ChildItem -Path build -Recurse -Filter "tbbmalloc*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName dist/ -Force }
          Get-ChildItem -Path build -Recurse -Filter "tiff*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName dist/ -Force; Write-Host "Copied $($_.Name)" }
          Get-ChildItem -Path build -Recurse -Filter "openvdb*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName dist/ -Force; Write-Host "Copied $($_.Name)" }
          if (-not (Get-ChildItem dist -Filter "openvdb*.dll" -ErrorAction SilentlyContinue)) {
            throw "openvdb.dll missing from dist — VDB from Polygons would be a no-op"
          }
          if (Test-Path "$env:DEPS_PREFIX/libraries") {
            New-Item -ItemType Directory -Force -Path dist/materialx | Out-Null
            Copy-Item -Recurse "$env:DEPS_PREFIX/libraries" dist/materialx/libraries
          }
          Copy-Item README.md dist/
          Copy-Item -Recurse docs dist/docs
          Copy-Item -Recurse examples dist/examples
          Remove-Item dist/solstice_tests.exe -ErrorAction SilentlyContinue
          if (Test-Path build/solstice_build_id.txt) {
            Copy-Item build/solstice_build_id.txt dist/
            Copy-Item build/solstice_output_name.txt dist/
          }
          $exeName = (Get-Content build/solstice_output_name.txt -ErrorAction SilentlyContinue | Select-Object -First 1).Trim()
          if (-not $exeName) { $exeName = "Grendizer_Render" }
          "BUILD_ID=$(Get-Content build/solstice_build_id.txt -ErrorAction SilentlyContinue | Select-Object -First 1)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OUTPUT_NAME=$exeName" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem dist
          $ocioDll = Get-ChildItem -Path dist -Filter "OpenColorIO*.dll" -ErrorAction SilentlyContinue
          if (-not $ocioDll) {
            throw "OpenColorIO.dll missing from dist — Windows Display/View would be a no-op"
          }
          Write-Host "Packaged OCIO runtime: $($ocioDll.Name)"
          if (-not (Get-ChildItem dist -Filter "cudart64_*.dll" -ErrorAction SilentlyContinue)) {
            throw "cudart64_*.dll missing from dist — OptiX would fail to load on the user's PC"
          }
          if (-not (Test-Path "dist/maketx.exe")) {
            throw "maketx.exe missing from dist — TX Converter would fail"
          }
          if (-not (Test-Path "dist/oiiotool.exe")) {
            throw "oiiotool.exe missing from dist — PNG/JPG and TX reformat would fail"
          }
          Write-Host "Packaged TX tools: maketx.exe, oiiotool.exe"
          & "dist/maketx.exe" --help | Select-Object -First 3
          & "dist/oiiotool.exe" --help | Select-Object -First 3

          # --- TX Tools packages: Alpha (Qt viewport) + Omega (DX12 viewport) ---
          function New-TxToolsPackage {
            param(
              [Parameter(Mandatory=$true)][string]$Edition,   # Alpha | Omega
              [Parameter(Mandatory=$true)][string]$ExeFilter,
              [Parameter(Mandatory=$true)][string]$OutDir
            )
            if (Test-Path $OutDir) { Remove-Item -Recurse -Force $OutDir }
            New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
            $txExe = Get-ChildItem -Path dist -Filter $ExeFilter | Select-Object -First 1
            if (-not $txExe) { throw "Grendizer_TX_Tools_$Edition.exe missing from dist (filter=$ExeFilter)" }
            Copy-Item $txExe.FullName $OutDir/ -Force
            foreach ($dir in @("platforms", "imageformats", "styles", "iconengines", "tls", "generic")) {
              if (Test-Path "dist/$dir") {
                New-Item -ItemType Directory -Force -Path "$OutDir/$dir" | Out-Null
                Copy-Item "dist/$dir/*" "$OutDir/$dir/" -Force -ErrorAction SilentlyContinue
              }
            }
            if (Test-Path "dist/qt.conf") { Copy-Item "dist/qt.conf" $OutDir/ -Force }
            Get-ChildItem dist -Filter "Qt6*.dll" | ForEach-Object { Copy-Item $_.FullName $OutDir/ -Force }
            foreach ($pat in @("vcruntime*.dll", "msvcp*.dll", "concrt*.dll", "embree*.dll", "tbb*.dll")) {
              Get-ChildItem dist -Filter $pat -ErrorAction SilentlyContinue |
                ForEach-Object { Copy-Item $_.FullName $OutDir/ -Force }
            }
            foreach ($pat in @(
              "OpenColorIO*.dll",
              "OpenImageIO*.dll",
              "openvdb*.dll",
              "maketx.exe", "oiiotool.exe",
              "jpeg*.dll", "libjpeg*.dll", "turbojpeg*.dll",
              "tiff*.dll", "libtiff*.dll",
              "zlib*.dll", "libzlib*.dll", "zdll*.dll",
              "libpng*.dll", "png*.dll",
              "Imath*.dll", "OpenEXR*.dll", "IlmThread*.dll", "Half*.dll", "Iex*.dll"
            )) {
              Get-ChildItem -Path dist -Filter $pat -ErrorAction SilentlyContinue |
                ForEach-Object { Copy-Item $_.FullName $OutDir/ -Force }
            }
            if (Test-Path "TX_Converter/README.md") {
              Copy-Item "TX_Converter/README.md" "$OutDir/README.md" -Force
            }
            if (-not (Test-Path "$OutDir/maketx.exe")) { throw "maketx.exe missing from TX Tools $Edition package" }
            if (-not (Test-Path "$OutDir/oiiotool.exe")) { throw "oiiotool.exe missing from TX Tools $Edition package" }
            if (-not (Get-ChildItem $OutDir -Filter "OpenColorIO*.dll" -ErrorAction SilentlyContinue)) {
              throw "OpenColorIO.dll missing from TX Tools $Edition package"
            }
            Write-Host "TX Tools $Edition package contents:"
            Get-ChildItem $OutDir -Recurse | Select-Object -ExpandProperty FullName
          }

          New-TxToolsPackage -Edition "Alpha" -ExeFilter "Grendizer_TX_Tools_Alpha*.exe" -OutDir "dist-tx-alpha"
          New-TxToolsPackage -Edition "Omega" -ExeFilter "Grendizer_TX_Tools_Omega*.exe" -OutDir "dist-tx-omega"

      - name: Render a frame with the packaged exe
        run: |
          $exe = Get-ChildItem -Path dist -Filter "Grendizer_Render-*.exe" | Select-Object -First 1
          if (-not $exe) { $exe = Get-Item "dist/Grendizer_Render.exe" -ErrorAction Stop }
          Write-Host "Smoke-testing $($exe.FullName)"
          Start-Process -FilePath $exe.FullName `
            -ArgumentList '--headless','-o','windows-smoke.png','-s','16','--width','480','--height','270' `
            -Wait -NoNewWindow
          if (-not (Test-Path windows-smoke.png)) { throw "the packaged exe did not produce an image" }
          Get-Item windows-smoke.png

      - uses: actions/upload-artifact@v4
        with:
          name: Grendizer-Render-windows-x64-${{ env.BUILD_ID }}
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Grendizer-TX-Tools-Alpha-windows-x64-${{ env.BUILD_ID }}
          path: dist-tx-alpha/

      - uses: actions/upload-artifact@v4
        with:
          name: Grendizer-TX-Tools-Omega-windows-x64-${{ env.BUILD_ID }}
          path: dist-tx-omega/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-render
          path: windows-smoke.png
